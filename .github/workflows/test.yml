name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - name: Install dependencies
        run: |
          python -m pip install --break-system-packages --no-cache-dir --target /tmp/pydeps pytest scipy warp-lang
          python -m pip install --break-system-packages --no-cache-dir --target /tmp/pydeps --no-deps --no-build-isolation "git+https://github.com/pypose/pypose.git@bae"
        env:
          PIP_CACHE_DIR: /tmp/pip-cache

      - name: Run tests
        env:
          PYTHONPATH: /tmp/pydeps:${{ github.workspace }}
          BAE_SKIP_EXTENSIONS: '1'
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -m pytest tests/ -v --ignore=tests/sparse/test_jtj.py --ignore=tests/sparse/test_solve.py --ignore=tests/sparse/test_bsr.py -k "not cuda"

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir pytest scipy warp-lang
          python -m pip install --no-cache-dir --no-deps --no-build-isolation "pypose @ git+https://github.com/pypose/pypose.git@bae"

      - name: Run tests
        env:
          BAE_SKIP_EXTENSIONS: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -m pytest tests/ -v --ignore=tests/sparse/test_jtj.py --ignore=tests/sparse/test_solve.py --ignore=tests/sparse/test_bsr.py -k "not cuda"
