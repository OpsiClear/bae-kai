name: Build Wheels

on:
  push:
    tags:
      - 'v*'
    branches: [release]
  pull_request:
    branches: [release, main]
  workflow_dispatch:
    inputs:
      skip_linux:
        description: 'Skip Linux builds'
        type: boolean
        default: false
      skip_windows:
        description: 'Skip Windows builds'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Enable CUDSS and DLL bundling for self-contained wheels
  USE_CUDSS: '1'
  BUNDLE_DLLS: '1'
  CUDSS_VERSION: '0.7.1.4'

jobs:
  # ============================================
  # Linux builds using NVIDIA CUDA images
  # ============================================
  build-linux:
    if: ${{ !inputs.skip_linux }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUDA 12.4 builds (PyTorch 2.5.x compatibility)
          - cuda: '12.4'
            cuda_full: '12.4.0'
            torch_index: 'https://download.pytorch.org/whl/cu124'
            arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"
          # Note: CUDA 12.6 Linux disabled - devel image too large for CI runner disk
          # CUDA 12.8 builds - Blackwell support (sm_70/75/80 covered by cu12.4)
          - cuda: '12.8'
            cuda_full: '12.8.0'
            torch_index: 'https://download.pytorch.org/whl/cu128'
            arch_list: "8.6;8.9;9.0;12.0"
          # CUDA 13.0 builds (PyTorch 2.9.x) - full sm_120 support
          - cuda: '13.0'
            cuda_full: '13.0.0'
            torch_index: 'https://download.pytorch.org/whl/cu130'
            # Full Blackwell support; older Maxwell/Pascal/Volta dropped in CUDA 13
            arch_list: "8.0;8.6;8.9;9.0;12.0"

    container:
      image: nvidia/cuda:${{ matrix.cuda_full }}-devel-ubuntu22.04

    env:
      TORCH_CUDA_ARCH_LIST: ${{ matrix.arch_list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          # Remove CUDA samples, documentation, and profiling tools
          rm -rf /usr/local/cuda/samples /usr/local/cuda/doc 2>/dev/null || true
          rm -rf /usr/local/cuda/nsight* /usr/local/cuda/NsightCompute* /usr/local/cuda/NsightSystems* 2>/dev/null || true
          rm -rf /usr/local/cuda/libnvvp /usr/local/cuda/nsightee_plugins 2>/dev/null || true
          rm -rf /usr/local/cuda/compute-sanitizer 2>/dev/null || true
          rm -rf /usr/local/cuda/extras 2>/dev/null || true
          rm -rf /usr/local/cuda/tools 2>/dev/null || true
          # Remove unnecessary CUDA libraries we don't link against
          rm -rf /usr/local/cuda/targets/x86_64-linux/lib/libnvrtc* 2>/dev/null || true
          rm -rf /usr/local/cuda/targets/x86_64-linux/lib/libcurand* 2>/dev/null || true
          rm -rf /usr/local/cuda/targets/x86_64-linux/lib/libcufft* 2>/dev/null || true
          rm -rf /usr/local/cuda/targets/x86_64-linux/lib/libnpp* 2>/dev/null || true
          rm -rf /usr/local/cuda/targets/x86_64-linux/lib/libcudnn* 2>/dev/null || true
          rm -rf /usr/local/cuda/targets/x86_64-linux/lib/libnvjpeg* 2>/dev/null || true
          # Remove CUDA static libraries (we only need shared)
          rm -rf /usr/local/cuda/targets/x86_64-linux/lib/*_static*.a 2>/dev/null || true
          # Clean apt cache and tmp
          apt-get clean || true
          rm -rf /var/lib/apt/lists/* /tmp/* 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h

      - name: Install Python 3.12 and build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git build-essential wget xz-utils \
            libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev \
            libncurses5-dev libffi-dev liblzma-dev
          # Build Python 3.12 from source
          cd /tmp
          wget -q https://www.python.org/ftp/python/3.12.10/Python-3.12.10.tar.xz
          tar -xf Python-3.12.10.tar.xz
          cd Python-3.12.10
          ./configure --prefix=/opt/python312 --with-ensurepip=install 2>&1 | tail -5
          make -j$(nproc) 2>&1 | tail -5
          make install 2>&1 | tail -5
          ln -sf /opt/python312/bin/python3.12 /usr/local/bin/python
          ln -sf /opt/python312/bin/python3.12 /usr/local/bin/python3
          ln -sf /opt/python312/bin/pip3.12 /usr/local/bin/pip
          ln -sf /opt/python312/bin/pip3.12 /usr/local/bin/pip3
          # Return to workspace before cleanup (cwd was /tmp/Python-3.12.10)
          cd /
          rm -rf /tmp/Python-3.12* 2>/dev/null || true
          python --version
          python -m pip install --upgrade pip setuptools wheel

      - name: Download and install CUDSS
        run: |
          mkdir -p /opt/cudss
          cd /tmp
          wget -q https://developer.download.nvidia.com/compute/cudss/redist/libcudss/linux-x86_64/libcudss-linux-x86_64-${CUDSS_VERSION}_cuda12-archive.tar.xz
          tar -xf libcudss-linux-x86_64-${CUDSS_VERSION}_cuda12-archive.tar.xz
          cp -r libcudss-linux-x86_64-${CUDSS_VERSION}_cuda12-archive/* /opt/cudss/
          # Clean up archive to save disk space
          rm -rf /tmp/libcudss-* 2>/dev/null || true
          echo "CUDSS_DIR=/opt/cudss" >> $GITHUB_ENV
          ls -la /opt/cudss/lib/ || true
          df -h

      - name: Install PyTorch
        run: |
          python -m pip install --no-cache-dir torch --index-url ${{ matrix.torch_index }}
          python -m pip install --no-cache-dir numpy scipy
          pip cache purge 2>/dev/null || true
          df -h

      - name: Show environment info
        run: |
          echo "=== Python ==="
          python --version
          echo "=== PyTorch ==="
          python -c "import torch; print(f'PyTorch {torch.__version__}, CUDA {torch.version.cuda}')"
          echo "=== NVCC ==="
          nvcc --version
          echo "=== CUDSS ==="
          ls -la $CUDSS_DIR/lib/ 2>/dev/null || echo "CUDSS not found"
          echo "=== TORCH_CUDA_ARCH_LIST ==="
          echo "$TORCH_CUDA_ARCH_LIST"
          echo "=== Disk space ==="
          df -h

      - name: Build wheel
        run: |
          echo "=== Disk before build ==="
          df -h
          MAX_JOBS=1 pip wheel . --no-deps --no-build-isolation -w dist/
          echo "=== Disk after build ==="
          df -h
          # Clean build artifacts to free space
          rm -rf build/ *.egg-info/ 2>/dev/null || true

      - name: Rename wheel with CUDA tag
        run: |
          cd dist
          for f in *.whl; do
            newname=$(echo "$f" | sed "s/\(bae-[0-9.]*\)/\1+cu${{ matrix.cuda }}/")
            mv "$f" "$newname"
          done
          ls -la

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-cu${{ matrix.cuda }}
          path: dist/*.whl

  # ============================================
  # Windows builds
  # ============================================
  build-windows:
    if: ${{ !inputs.skip_windows }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.4'
            cuda_version: '12.4.0'
            torch_index: 'https://download.pytorch.org/whl/cu124'
            arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"
          - cuda: '12.6'
            cuda_version: '12.6.3'
            torch_index: 'https://download.pytorch.org/whl/cu126'
            arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"
          # CUDA 12.8 with sm_120 (Blackwell) support
          - cuda: '12.8'
            cuda_version: '12.8.0'
            torch_index: 'https://download.pytorch.org/whl/cu128'
            arch_list: "7.5;8.0;8.6;8.9;9.0;12.0"
          # Note: Windows CUDA 13.0 disabled - compilation issues with toolkit on CI
          # Use Linux CUDA 13.0 or Windows CUDA 12.8 for Blackwell support

    env:
      TORCH_CUDA_ARCH_LIST: ${{ matrix.arch_list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda_version }}
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cusparse", "cusparse_dev", "cusolver", "cusolver_dev", "cufft", "cufft_dev", "thrust", "visual_studio_integration"]'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download and install CUDSS
        shell: pwsh
        run: |
          $cudssUrl = "https://developer.download.nvidia.com/compute/cudss/redist/libcudss/windows-x86_64/libcudss-windows-x86_64-${{ env.CUDSS_VERSION }}_cuda12-archive.zip"
          $cudssDir = "C:\cudss"
          New-Item -ItemType Directory -Force -Path $cudssDir
          Invoke-WebRequest -Uri $cudssUrl -OutFile "$env:TEMP\cudss.zip"
          Expand-Archive -Path "$env:TEMP\cudss.zip" -DestinationPath "$env:TEMP\cudss_extract" -Force
          # Move contents from extracted folder to cudss dir
          $extractedDir = Get-ChildItem "$env:TEMP\cudss_extract" | Select-Object -First 1
          Copy-Item -Path "$($extractedDir.FullName)\*" -Destination $cudssDir -Recurse -Force
          echo "CUDSS_DIR=$cudssDir" >> $env:GITHUB_ENV
          Get-ChildItem $cudssDir -Recurse | Select-Object FullName

      - name: Set CUDA environment variables
        run: |
          # cuda-toolkit action sets CUDA_PATH, but PyTorch expects CUDA_HOME
          echo "CUDA_HOME=$env:CUDA_PATH" >> $env:GITHUB_ENV
          echo "CUDA_PATH=$env:CUDA_PATH"
          echo "Setting CUDA_HOME to $env:CUDA_PATH"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url ${{ matrix.torch_index }}
          python -m pip install numpy scipy

      - name: Show environment info
        run: |
          echo "=== Python ==="
          python --version
          echo "=== PyTorch ==="
          python -c "import torch; print(f'PyTorch {torch.__version__}, CUDA {torch.version.cuda}')"
          echo "=== NVCC ==="
          nvcc --version
          echo "=== CUDA_PATH ==="
          echo $env:CUDA_PATH
          echo "=== CUDA_HOME ==="
          echo $env:CUDA_HOME
          echo "=== CUDSS_DIR ==="
          echo $env:CUDSS_DIR
          Get-ChildItem "$env:CUDSS_DIR\bin" -ErrorAction SilentlyContinue
          echo "=== TORCH_CUDA_ARCH_LIST ==="
          echo $env:TORCH_CUDA_ARCH_LIST

      - name: Build wheel
        run: |
          $env:DISTUTILS_USE_SDK = "1"
          pip wheel . --no-deps --no-build-isolation -w dist/
        env:
          DISTUTILS_USE_SDK: '1'

      - name: Rename wheel with CUDA tag
        shell: bash
        run: |
          cd dist
          for f in *.whl; do
            newname=$(echo "$f" | sed "s/\(bae-[0-9.]*\)/\1+cu${{ matrix.cuda }}/")
            mv "$f" "$newname"
          done
          ls -la

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-cu${{ matrix.cuda }}
          path: dist/*.whl

  # ============================================
  # Collect and verify wheels
  # ============================================
  collect-wheels:
    needs: [build-linux, build-windows]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List all wheels
        run: |
          echo "=== Built Wheels ==="
          ls -lh wheels/
          echo ""
          echo "=== Wheel Names ==="
          for f in wheels/*.whl; do
            echo "$(basename $f)"
          done

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: bae-wheels-all
          path: wheels/*.whl
          retention-days: 30

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    needs: collect-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Generate release notes
        run: |
          cat > notes.md << 'NOTES'
          ## Installation

          ```bash
          pip install bae-kai
          ```

          ## Available Wheels

          | Platform | CUDA | Architectures |
          |----------|------|---------------|
          | Linux | 12.4, 12.8, 13.0 | sm_70 - sm_120 |
          | Windows | 12.4, 12.6, 12.8 | sm_70 - sm_120 |

          All wheels include bundled CUDA libraries and cuDSS.
          Wheels are available on [PyPI](https://pypi.org/project/bae-kai/).
          Build artifacts are attached to the [workflow run](https://github.com/OpsiClear/bae-kai/actions/workflows/build-wheels.yml).
          NOTES

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
